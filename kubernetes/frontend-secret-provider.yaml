apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  name: frontend-secret-provider
  namespace: ecommerce
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  provider: aws
  
  parameters:
    objects: |
      - objectName: "ecommerce/frontend-secrets"
        objectType: "secretsmanager"
        jmesPath:
          - path: BACKEND_URL
            objectAlias: BACKEND_URL
          - path: RAZORPAY_KEY_ID
            objectAlias: RAZORPAY_KEY_ID

  secretObjects:
    - secretName: frontend-secret
      type: Opaque
      data:
        - objectName: BACKEND_URL
          key: BACKEND_URL
        - objectName: RAZORPAY_KEY_ID
          key: RAZORPAY_KEY_ID
