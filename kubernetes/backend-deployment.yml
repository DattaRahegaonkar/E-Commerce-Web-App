
kind: Deployment
apiVersion: apps/v1
metadata:
  name: backend-deployment
  namespace: ecommerce
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      name: backend-pod
      labels:
        app: backend

    spec:
      serviceAccountName: secret-manager-sa

      containers:
        - name: backend-container
          image: dattarahegaonkar09/ecommerce-app-backend:v7
          ports:
            - containerPort: 8081

          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MONGO_URI

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET

            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: NODE_ENV

            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: PORT

            - name: JWT_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_EXPIRES_IN

            - name: ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: ALLOWED_ORIGINS

          volumeMounts:
            - mountPath: /mnt/secrets-store
              name: backend-secrets-store
              readOnly: true

          resources:
            requests:
              memory: "40Mi"
              cpu: "5m"
            limits:
              memory: "400Mi"
              cpu: "500m"

      volumes:
        - name: backend-secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "backend-secret-provider"  
                 
      restartPolicy: Always
