apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ecommerce-app
  namespace: argocd

spec:
  project: ecommerce-project

  source:
    repoURL: https://github.com/DattaRahegaonkar/E-Commerce-Web-App.git
    targetRevision: main
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
