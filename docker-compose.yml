
services:
  mongodb:
    image: mongo:latest
    container_name: mongodb-container
    networks:
      - ecommerce-network
    volumes:
      - ecommerce-volume:/data/db
    restart: unless-stopped
    env_file:
      - ./database/.env
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    image: dattarahegaonkar09/ecommerce-backend:v1
    # build:
    #   context: ./Backend
    #   dockerfile: Dockerfile
    container_name: backend-container
    networks:
      - ecommerce-network
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8081/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    
  frontend:
    image: dattarahegaonkar09/ecommerce-frontend:v1
    # build:
    #   context: ./Frontend
    #   dockerfile: Dockerfile
    container_name: frontend-container
    networks:
      - ecommerce-network
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://localhost
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 5


  nginx:
    image: nginx:alpine
    container_name: nginx-container
    networks:
      - ecommerce-network
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy


networks:
  ecommerce-network:
    external: true
    name: ecommerce-network

volumes:
  ecommerce-volume:
    external: true
    name: ecommerce-volume
