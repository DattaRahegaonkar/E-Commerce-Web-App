apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eks-cluster
  region: eu-west-1

vpc:
  id: vpc-078117731ea0e626b

  subnets:
    public:
      eu-west-1a:
        id: subnet-09275a0a9ef83360a

      eu-west-1b:
        id: subnet-03b28db2a1e5ceabc

    private:
      eu-west-1a:
        id: subnet-0d0f9a2548cbb68c3

      eu-west-1b:
        id: subnet-013e2317a199792db

iam:
  withOIDC: true

  serviceAccounts:
    - metadata:
        name: secret-manager-sa
        namespace: ecommerce

      attachPolicyARNs:
        - arn:aws:iam::972841066657:policy/secrets-policy

      roleName: secrets-role


managedNodeGroups:
  - name: ng-1

    instanceType: c7i-flex.large

    desiredCapacity: 2
    minSize: 1
    maxSize: 3

    privateNetworking: true


addons:
  - name: eks-pod-identity-agent

  - name: aws-secrets-store-csi-driver-provider

  - name: aws-ebs-csi-driver
    attachPolicyARNs:
      - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy
