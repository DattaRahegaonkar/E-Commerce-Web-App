apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eks-cluster
  region: eu-west-1

vpc:
  id: vpc-0799c72083c8a2751

  subnets:
    public:
      eu-west-1a:
        id: subnet-03a768429515c6221

      eu-west-1b:
        id: subnet-033b8a772306a44c8

    private:
      eu-west-1a:
        id: subnet-053a1af63e0b20f2b

      eu-west-1b:
        id: subnet-028f97fb9339c0e43

iam:
  withOIDC: true

  serviceAccounts:
    - metadata:
        name: secret-manager-sa
        namespace: ecommerce

      attachPolicyARNs:
        - arn:aws:iam::972841066657:policy/secrets-policy

      roleName: secrets-role


managedNodeGroups:
  - name: ng-1

    instanceType: c7i-flex.large

    desiredCapacity: 2
    minSize: 1
    maxSize: 3

    privateNetworking: true


addons:
  - name: eks-pod-identity-agent

  - name: aws-secrets-store-csi-driver-provider

  - name: aws-ebs-csi-driver
    attachPolicyARNs:
      - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy
