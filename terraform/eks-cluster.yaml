apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eks-cluster
  region: eu-west-1

vpc:
  id: vpc-0c587e573dcdc0886

  subnets:
    public:
      eu-west-1a:
        id: subnet-047bf6844deca3dee

      eu-west-1b:
        id: subnet-005bd765370d68518

    private:
      eu-west-1a:
        id: subnet-0d425d76159c2b0dc

      eu-west-1b:
        id: subnet-026653161c21cd862

iam:
  withOIDC: true

  serviceAccounts:
    - metadata:
        name: secret-manager-sa
        namespace: ecommerce

      attachPolicyARNs:
        - arn:aws:iam::972841066657:policy/secrets-policy

      roleName: secrets-role


managedNodeGroups:
  - name: ng-1

    instanceType: c7i-flex.large

    desiredCapacity: 2
    minSize: 1
    maxSize: 3

    privateNetworking: true


addons:
  - name: eks-pod-identity-agent

  - name: aws-secrets-store-csi-driver-provider

  - name: aws-ebs-csi-driver
    attachPolicyARNs:
      - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy
